name: ci
on: { pull_request: {}, merge_group: {}, push: { branches: [main] } }
concurrency: { group: "ci-${{ github.ref }}", cancel-in-progress: true }
jobs:
  datasets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: make gate-datasets
  shacl:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: actions/cache@v4
        id: jena
        with:
          path: ${{ runner.temp }}/apache-jena-5.2.0
          key: jena-5.2.0
      - name: Install Apache Jena (pinned, sha512-verified)
        if: steps.jena.outputs.cache-hit != 'true'
        run: |
          v=5.2.0; h=9a66044573ca269c0a9a1191fe7a8e1925f2d77e2e0bdadddd68616a1bafed1d9819c0b2988dd03614ec778a3882ccb091d825976fc0837406916f9f001b701c
          curl -fsSL -o "$RUNNER_TEMP/jena.tgz" "https://archive.apache.org/dist/jena/binaries/apache-jena-$v.tar.gz"
          echo "$h  $RUNNER_TEMP/jena.tgz" | sha512sum -c -
          tar -xzf "$RUNNER_TEMP/jena.tgz" -C "$RUNNER_TEMP"
      - run: echo "$RUNNER_TEMP/apache-jena-5.2.0/bin" >> "$GITHUB_PATH"
      - run: make gate-shacl
  julia:
    timeout-minutes: 45
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with: { version: "1.12.1" }
      - uses: actions/cache@v4
        with:
          path: ~/.julia
          key: julia-${{ runner.os }}-1.12.1-${{ hashFiles('julia/**/Manifest.toml') }}
      - name: Install the package
        run: julia --project=julia/AgenticDS.jl -e "using Pkg; Pkg.instantiate()"
      - name: Test the package
        run: julia --project=julia/AgenticDS.jl -e "using Pkg; Pkg.test()"
      - name: Run the examples
        run: for e in julia/AgenticDS.jl/examples/*/run.jl; do julia --project=julia/AgenticDS.jl "$e" > /dev/null; done
  julia-quality:
    timeout-minutes: 45
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with: { version: "1.12.1" }
      - uses: actions/cache@v4
        with:
          path: ~/.julia
          key: julia-quality-${{ runner.os }}-1.12.1-${{ hashFiles('julia/**/Manifest.toml') }}
      - run: make gate-julia
  r:
    timeout-minutes: 45
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with: { r-version: "4.5.1", use-public-rspm: true }
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: r/agenticds
          cache-version: 1
      - name: Install the package
        run: R CMD INSTALL r/agenticds
      - name: Test the package
        run: Rscript -e 'testthat::test_dir("r/agenticds/tests/testthat", package = "agenticds", load_package = "installed")'
        env: { ADS_ROOT: "${{ github.workspace }}" }
      - name: Run the examples
        run: for e in r/agenticds/inst/examples/*/run.R; do Rscript "$e" > /dev/null; done
  r-quality:
    timeout-minutes: 45
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with: { r-version: "4.5.1", use-public-rspm: true }
      - name: Isolate R from runner user state (no user library, no profiles)
        run: |
          h="$RUNNER_TEMP/rhome"; mkdir -p "$h"
          { echo "R_USER_CACHE_DIR=$h/.cache/R"; echo "R_LIBS_USER=$RUNNER_TEMP/rnolib"; echo "R_LIBS_SITE=$RUNNER_TEMP/rnolib"
            echo "R_ENVIRON_USER=/dev/null"; echo "R_PROFILE_USER=/dev/null"; } >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/rlib
          key: rlib-${{ runner.os }}-4.5.1-${{ hashFiles('scripts/r-pins.txt', 'scripts/r-deps.sh') }}
      - name: Install pinned R tools (styler, lintr, covr; CRAN snapshot 2026-10-20)
        run: scripts/r-deps.sh "$RUNNER_TEMP/rlib" && echo "ADS_RLIB=$RUNNER_TEMP/rlib" >> "$GITHUB_ENV"
      - run: make gate-r
  lean:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSfL https://elan.lean-lang.org/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.elan/toolchains
            ~/.cache/mathlib
          key: lean-${{ runner.os }}-${{ hashFiles('lean/AgenticDS/lean-toolchain', 'lean/AgenticDS/lake-manifest.json') }}
      - name: Mathlib oleans (download into the workspace, nothing installed on the host)
        working-directory: lean/AgenticDS
        run: ~/.elan/bin/lake exe cache get
      - run: make gate-lean
  gate:
    name: gate
    if: always()
    needs: [datasets, shacl, r, r-quality, julia, julia-quality, lean]
    runs-on: ubuntu-24.04
    steps:
      - run: |
          if ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}; then exit 1; fi
