name: gitleaks-nightly
# Scheduled secret scan of the full history. Not part of the PR or merge path.
on:
  schedule: [{ cron: "17 3 * * *" }]
  workflow_dispatch: {}
permissions: { contents: read }
concurrency: { group: gitleaks-nightly, cancel-in-progress: false }
jobs:
  gitleaks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Scan history (pinned gitleaks 8.30.1, sha256-verified)
        run: scripts/gitleaks.sh "$RUNNER_TEMP/gitleaks"
      - name: Allowlist self-test (generated fixtures)
        run: scripts/gitleaks-selftest.sh "$RUNNER_TEMP/gitleaks/gitleaks" .gitleaks.toml
