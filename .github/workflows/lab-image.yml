name: lab-image
on:
  pull_request: { paths: ["labs/e-final/**", ".github/workflows/lab-image.yml"] }
  merge_group: {}
  push: { branches: [main], paths: ["labs/e-final/**"] }
concurrency: { group: "lab-image-${{ github.ref }}", cancel-in-progress: true }
permissions: { contents: read }
jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Free disk (the image is ~9 GB)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost /usr/share/swift && sudo docker image prune -af >/dev/null && df -h / | tail -n 1
      - name: Falsifier (a Dockerfile without the default is refused)
        run: bash labs/e-final/tests/falsify-image-pin.sh
      - name: Pin check (Dockerfile default equals lean-toolchain, installer verified)
        run: bash labs/e-final/tests/image-pin.sh
      - name: Falsifier + check (the image ships the starter and start.sh seeds it)
        run: bash labs/e-final/tests/falsify-starter-seed.sh && bash labs/e-final/tests/starter-seed.sh
      - name: lab README ships, ~/go gone, starter outside ~ (LAB-STD-001)
        run: bash labs/e-final/tests/falsify-lab-readme.sh && bash labs/e-final/tests/lab-readme.sh
      - name: Build (ZERO build args, as Coursera does)
        shell: bash
        run: bash labs/e-final/tests/build-image.sh ads-lean-lab:ci | tee "$RUNNER_TEMP/build.txt"
      - name: Fresh-container test (starter fails, solution passes, 5 plants refused, first demo <= 300 s)
        shell: bash
        run: bash labs/e-final/tests/image-test.sh ads-lean-lab:ci | tee "$RUNNER_TEMP/test.txt"
      - name: Report size, build time and test results
        if: always()
        run: |
          { echo '### lab image'; echo '```'; cat "$RUNNER_TEMP/build.txt" "$RUNNER_TEMP/test.txt" 2>/dev/null; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
