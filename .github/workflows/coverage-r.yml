name: coverage-r
# Coverage receipt for the R package: covr line coverage must be exactly 100.
# Runs on demand, from a release workflow (workflow_call), and on changes to this file.
on:
  workflow_dispatch: {}
  workflow_call: {}
  pull_request:
    paths: [".github/workflows/coverage-r.yml"]
concurrency: { group: "coverage-r-${{ github.ref }}", cancel-in-progress: true }
jobs:
  coverage-r:
    timeout-minutes: 45
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: System libraries for the R build (Posit ubuntu-2404 tarball)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends libblas3 liblapack3 libgfortran5 libicu-dev libcurl4-openssl-dev libssl-dev libxml2-dev libpcre2-8-0 libbz2-1.0 liblzma5 libreadline8 libtirpc3 libdeflate0 libgomp1 zlib1g
      - name: Isolate R from runner user state (empty HOME, no user library, no profiles)
        run: |
          h="$RUNNER_TEMP/rhome"; mkdir -p "$h"
          { echo "HOME=$h"; echo "XDG_CONFIG_HOME=$h/.config"; echo "XDG_CACHE_HOME=$h/.cache"
            echo "R_USER_CACHE_DIR=$h/.cache/R"; echo "R_LIBS_USER=$RUNNER_TEMP/rnolib"; echo "R_LIBS_SITE=$RUNNER_TEMP/rnolib"
            echo "R_ENVIRON_USER=/dev/null"; echo "R_PROFILE_USER=/dev/null"; } >> "$GITHUB_ENV"
      - name: Install R 4.6.1 (pinned, sha256-verified, into RUNNER_TEMP)
        run: scripts/install-r.sh "$RUNNER_TEMP/r" && echo "$RUNNER_TEMP/r/4.6.1/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/rlib
          key: rlib-${{ runner.os }}-4.6.1-${{ hashFiles('scripts/r-pins.txt', 'scripts/r-deps.sh') }}
      - name: Install pinned R tools (covr, testthat; CRAN snapshot 2026-10-20)
        run: scripts/r-deps.sh "$RUNNER_TEMP/rlib" && echo "ADS_RLIB=$RUNNER_TEMP/rlib" >> "$GITHUB_ENV"
      - name: Measure coverage (fails unless covr lines = 100)
        run: set -o pipefail; make gate-r 2>&1 | tee "$RUNNER_TEMP/coverage-r.log"
      - name: Write the coverage receipt
        run: |
          { echo "language: R"; echo "tool: covr"; echo "commit: $GITHUB_SHA"; grep -m1 '^covr:' "$RUNNER_TEMP/coverage-r.log"; } | tee "$RUNNER_TEMP/coverage-r.txt" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with: { name: coverage-r, path: "${{ runner.temp }}/coverage-r.txt" }
