[package]
name = "ads-rust"
version = "0.1.0"
edition = "2021"
publish = false
autoexamples = false
default-run = "a-m2-ols"
description = "Agentic Data Science, Course A (Rust): examples P1-P4"

[profile.dev]
debug = 0

[dependencies]
polars = { version = "0.46", default-features = false, features = ["lazy", "csv", "dtype-full"] }
serde_json = "1"
aprender = { version = "0.71.4", default-features = false }
aprender-viz = { version = "0.71.4", default-features = false, features = ["terminal"] }

[[example]]
name = "a-m1-p1"
path = "examples/a-m1-p1/main.rs"

[[example]]
name = "a-m1-p1-profile"
path = "examples/a-m1-p1-profile/main.rs"

[[bin]]
name = "a-m2-ols"
path = "examples/a-m2-ols/main.rs"
