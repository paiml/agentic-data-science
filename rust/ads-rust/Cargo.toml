[package]
name = "ads-rust"
version = "0.1.0"
edition = "2024"
publish = false
description = "Agentic Data Science, Course A (Rust): examples P1-P4"

[dependencies]
linfa = "0.8"
linfa-linear = "0.8"
ndarray = "0.16"
polars = { version = "0.46", default-features = false, features = ["lazy", "csv", "dtype-full"] }
serde_json = "1"

[[example]]
name = "a-m1-p1"
path = "examples/a-m1-p1/main.rs"

[[example]]
name = "a-m1-p1-profile"
path = "examples/a-m1-p1-profile/main.rs"

[[example]]
name = "a-m2-p2-ols"
path = "examples/a-m2-p2-ols/main.rs"

[[example]]
name = "a-m2-p2-cv"
path = "examples/a-m2-p2-cv/main.rs"

[[example]]
name = "a-m3-p3-tree"
path = "examples/a-m3-p3-tree/main.rs"

[[example]]
name = "a-m3-p3-kmeans"
path = "examples/a-m3-p3-kmeans/main.rs"

[[example]]
name = "a-m4-p4-pipeline"
path = "examples/a-m4-p4-pipeline/main.rs"

[[example]]
name = "a-m4-p4-bench"
path = "examples/a-m4-p4-bench/main.rs"

[dev-dependencies]
criterion = { version = "0.5", default-features = false }

[[bench]]
name = "p4"
harness = false
