[versions]
kotlin = "2.4.0"
kover = "0.9.9"
ktlint-plugin = "12.3.0"
detekt = "1.23.8"
dataframe = "1.0.0-rc01"
junit = "5.11.4"
jackson = "2.18.2"
kandy = "0.8.6"
mordant = "3.1.0"
commons-math = "3.6.1"
slf4j = "2.0.16"

[libraries]
dataframe = { module = "org.jetbrains.kotlinx:dataframe", version.ref = "dataframe" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
kandy = { module = "org.jetbrains.kotlinx:kandy-lets-plot", version.ref = "kandy" }
mordant = { module = "com.github.ajalt.mordant:mordant", version.ref = "mordant" }
commons-math = { module = "org.apache.commons:commons-math3", version.ref = "commons-math" }
slf4j-nop = { module = "org.slf4j:slf4j-nop", version.ref = "slf4j" }
jackson = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint-plugin" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
