# ads-kotlin-m1-v09-pmat-v1: Course D (Kotlin), Module 1, scene m1-09 (pmat)

metadata:
  version: "1.0.0"
  created: "2026-10-26"
  kind: pattern
  author: "PAIML Engineering"
  description: "Scene m1v09 runs the tool's own command (pmat quality-gate --checks complexity,satd,duplicates) and shows its native output, then exit=0."
  references:
    - "kotlin/ads-kotlin/src/main/kotlin/com/paiml/ads/P1.kt"
    - "kotlin/ads-kotlin/src/test/kotlin/com/paiml/ads/SceneLayoutTest.kt"
    - "kotlin/ads-kotlin/src/test/kotlin/com/paiml/ads/BuildWiringTest.kt"
    - "kotlin/ads-kotlin/src/test/kotlin/com/paiml/ads/ToolsFailOnFindingsTest.kt"
    - "kotlin/ads-kotlin/scenes/m1v09.scene"
    - "CLASSIFICATION (kind: pattern, not kernel): scene or tool check, no kani harness"

equations:
  m1-v09-pmat-v1:
    formula: |
      cwd: kotlin
      run: pmat quality-gate --checks complexity,satd,duplicates
      native pass line: Quality gate PASSED
      echo "exit=$?" prints exit=0
    domain: "the merged course tree at the scene commit"
    codomain: "the tool's own output and exit code 0"
    postconditions:
      - "NATIVE_OUTPUT: the pass line is the tool's own; nothing in the build prints a fixed verdict (BuildWiringTest.noFixedPassLineIsPrintedByTheBuild)"
      - "FAILS_ON_FINDINGS: the tool exits non-zero on a blocking violation (ToolsFailOnFindingsTest.pmatFailsOnAComplexFunctionAndPassesWhenItIsFixed runs pmat live on a planted violation)"
      - "LAYOUT: the shown region is at most 25 lines of at most 59 columns (SceneLayoutTest)"

proof_obligations:
  - type: invariant
    property: "The tool exits 0 on the committed tree"
    formal: "exit(run) = 0 and output contains the native pass line"
    applies_to: m1-v09-pmat-v1

falsification_tests:
  - id: FALSIFY-ADS-KOTLIN-M1-V09-001
    rule: "The tool exits 0 on the committed tree"
    prediction: "pmat quality-gate --checks complexity,satd,duplicates exits 0 on the scene commit"
    test: "pmat quality-gate --checks complexity,satd,duplicates"
    mutation: "ToolsFailOnFindingsTest.pmatFailsOnAComplexFunctionAndPassesWhenItIsFixed: a function over the complexity limit fails pmat with the cyclomatic-complexity finding and the fixed file passes (the claim covers the complexity check; satd and duplicates are run on camera but not shown failing)"
    discriminates: "A tool that cannot fail certifies nothing"
    if_fails: "A gate that cannot fail certifies nothing"
