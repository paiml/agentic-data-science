# ads-kotlin-m1-v06-datasets-v1: Course D (Kotlin), Module 1, scene m1-06 (datasets)

metadata:
  version: "1.0.0"
  created: "2026-10-26"
  kind: pattern
  author: "PAIML Engineering"
  description: "Scene m1v06 runs the tool's own command (sha256sum -c SHA256SUMS) and shows its native output, then exit=0."
  references:
    - "kotlin/ads-kotlin/../../datasets/penguins/penguins.csv"
    - "kotlin/ads-kotlin/src/test/kotlin/com/paiml/ads/SceneLayoutTest.kt"
    - "kotlin/ads-kotlin/src/test/kotlin/com/paiml/ads/BuildWiringTest.kt"
    - "kotlin/ads-kotlin/src/test/kotlin/com/paiml/ads/ToolsCanFailTest.kt"
    - "kotlin/ads-kotlin/scenes/m1v06.scene"
    - "CLASSIFICATION (kind: pattern, not kernel): scene or tool check, no kani harness"

equations:
  m1-v06-datasets-v1:
    formula: |
      cwd: datasets/penguins
      run: sha256sum -c SHA256SUMS
      native pass line: penguins.csv: OK
      echo "exit=$?" prints exit=0
    domain: "the merged course tree at the scene commit"
    codomain: "the tool's own output and exit code 0"
    postconditions:
      - "NATIVE_OUTPUT: the pass line is the tool's own; nothing in the build prints a fixed verdict (BuildWiringTest.noFixedPassLineIsPrintedByTheBuild)"
      - "FAILS_ON_FINDINGS: sha256sum exits non-zero on a changed byte (ToolsCanFailTest.sha256sumFailsOnAChangedByte)"
      - "LAYOUT: the shown region is at most 25 lines of at most 59 columns (SceneLayoutTest)"

proof_obligations:
  - type: invariant
    property: "The tool exits 0 on the committed tree"
    formal: "exit(run) = 0 and output contains the native pass line"
    applies_to: m1-v06-datasets-v1

falsification_tests:
  - id: FALSIFY-ADS-KOTLIN-M1-V06-001
    rule: "The tool exits 0 on the committed tree"
    prediction: "sha256sum -c SHA256SUMS exits 0 on the scene commit"
    test: "sha256sum -c SHA256SUMS"
    mutation: "ToolsCanFailTest.sha256sumFailsOnAChangedByte: a changed byte in a copy of the dataset makes sha256sum -c exit non-zero"
    discriminates: "A tool that cannot fail certifies nothing"
    if_fails: "A gate that cannot fail certifies nothing"
