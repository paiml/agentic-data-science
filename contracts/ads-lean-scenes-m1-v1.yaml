# ads-lean-scenes-m1-v1: Course E (Lean 4), Module 1 scene code (v01..v10)

metadata:
  version: "1.0.0"
  created: "2026-10-26"
  kind: pattern
  author: "PAIML Engineering"
  description: "Ten on-camera scenes for Course E module 1, one per video of courses/E-lean/m1/storyboard.md: mean and variance over a field, exact rationals against Float, the toolchain pin, the unfinished-proof scan, the three theorem statements, golden parity against R, the axiom report, the contract and its falsifier, the four gate checks and the recap. Each scene file is at most 25 lines of 59 columns."
  references:
    - "lean/AgenticDS/AgenticDS/Scenes/M1.lean"
    - "lean/AgenticDS/AgenticDSTest/ScenesM1.lean"
    - "demos/e-m1/scenes.spec"
    - "courses/E-lean/m1/storyboard.md"
    - "CLASSIFICATION (kind: pattern): scene values asserted by the test, theorems kernel-checked"

equations:
  m1_scene_facts:
    formula: |
      mean [2,4,4,4,5,5,7,9] = 5,  variance = 4
      1/3 + 1/3 + 1/3 = 1 in Q,  (0.1 + 0.2 == 0.3) = false in Float
      axioms(variance_shift) subset {propext, Classical.choice, Quot.sound}
    domain: "the Lean sources under lean/AgenticDS and datasets/golden/p1.json"
    codomain: "ten registered scenes that run and print what the video shows"
    postconditions:
      - "SHAPE: every scene file is at most 25 lines and 59 columns"
      - "REGISTRY: the number of scene files equals the number of registered scenes"
      - "TOOLS: demos/e-m1/scenes.spec lists the native commands the camera types, each followed by its own echo exit=$?; gate-lean.sh replays them and checks the real output (no script, wrapper, pipe or devnull)"
      - "GOLDEN: the Adelie body mass mean agrees with p1.json within 1e-9"
      - "CAN_FAIL: a scene that breaks the shape or a stated value fails the test"

proof_obligations:
  - type: invariant
    property: "The scene test reports contract: ads-lean-scenes-m1-v1 OK only when every check passes"
    formal: "ScenesM1.main returns 0 iff shape, registry, values, axioms and every scene run succeed"
    applies_to: m1_scene_facts

falsification_tests:
  - id: FALSIFY-ADS-LEAN-SCENES-M1-001
    rule: "Scene values match the narration"
    prediction: "lake env lean --run AgenticDSTest/ScenesM1.lean prints contract: ads-lean-scenes-m1-v1 OK"
    test: "lean/AgenticDS/AgenticDSTest/ScenesM1.lean"
    mutation: "Change m1v01_xs to [2, 4, 4, 4, 5, 5, 7, 10]: the mean and variance guards fail to compile"
    discriminates: "A scene with a wrong number cannot pass the guards"
    if_fails: "A video shows a value the narration does not state"
  - id: FALSIFY-ADS-LEAN-SCENES-M1-002
    rule: "Scene files keep the on-camera shape"
    prediction: "no line is wider than 59 columns and no file longer than 25 lines"
    test: "moduleShape 1 in AgenticDS/Scenes/Run.lean"
    mutation: "Add a 60-column line to M1V02.lean: the test prints FAIL and exits 1"
    discriminates: "A scene that would be cut off on screen cannot merge"
    if_fails: "The recording clips code lines"
  - id: FALSIFY-ADS-LEAN-SCENES-M1-003
    rule: "The camera types only native commands, each with its own exit echo"
    prediction: "scripts/scene-spec.sh replay demos/e-m1/scenes.spec exits 0 and its selftest refuses broken specs"
    test: "scripts/scene-spec.sh (run by scripts/gate-lean.sh stage 4)"
    mutation: "Type bash demos/e-m1/x.sh, a pipe or > /dev/null in a spec line: check refuses it; change an expected output line: replay fails"
    discriminates: "A hidden or wrapped tool, or output the tool no longer prints, cannot merge"
    if_fails: "A video shows a command the viewer cannot run or output the tool did not print"
