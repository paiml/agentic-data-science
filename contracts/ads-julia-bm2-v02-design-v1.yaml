# ads-julia-bm2-v02-design-v1: Course B (Julia), Module 2 scene v02 (design matrices)
# Extends ads-julia-p2-ols-demo-v1 (same golden); the scene file is julia/BM2/src/v02_design.jl

metadata:
  version: "1.0.0"
  created: "2026-10-26"
  kind: pattern
  author: "PAIML Engineering"
  description: "intercept_design, species_dummies and baseline build the P2 design matrices: [1 x] of size 342 x 2 and a species design with two dummy columns, Adelie as the baseline."
  references:
    - "contracts/ads-julia-p2-ols-demo-v1.yaml"
    - "datasets/golden/p2.json"
    - "julia/BM2/src/v02_design.jl"
    - "julia/BM2/scenes/v02-design.scene"
    - "julia/BM2/test/runtests.jl"
    - "CLASSIFICATION (kind: pattern, not kernel): numeric parity against a golden file, no kani harness"

equations:
  b2_v02_design_matrices:
    formula: |
      size([1 x])                         = (342, 2)
      X[1:3, :]                           = [1 181; 1 186; 1 195]
      sum(Chinstrap), sum(Gentoo), Adelie = 68, 123, 151
    domain: "data/penguins.csv (344 rows, NA as the string NA), data/folds.csv and data/p2.json in julia/BM2"
    codomain: "the printed scene output and its verdict line"
    postconditions:
      - "INTERCEPT_COLUMN: the first design column is all ones"
      - "DUMMIES: Chinstrap and Gentoo columns sum to 68 and 123"
      - "BASELINE: the remaining 151 rows are Adelie, the baseline"

proof_obligations:
  - type: invariant
    property: "Dummy counts partition the clean rows"
    formal: "68 + 123 + 151 = 342 = rows(load())"
    applies_to: b2_v02_design_matrices

falsification_tests:
  - id: FALSIFY-ADS-JULIA-BM2-V02-001
    rule: "The design has a ones column and the right shape"
    prediction: "the shape test passes with (342, 2) and the first three rows match"
    test: "julia --project=julia/BM2 -e 'using Pkg; Pkg.test()'"
    mutation: "Drop the ones column from intercept_design: the shape becomes (342, 1) and the shape test fails"
    discriminates: "A design without the intercept cannot be 342 x 2"
    if_fails: "OLS would fit through the origin"
  - id: FALSIFY-ADS-JULIA-BM2-V02-002
    rule: "The dummies encode exactly two species"
    prediction: "the dummy sums are 68 and 123"
    test: "julia --project=julia/BM2 -e 'using Pkg; Pkg.test()'"
    mutation: "Build the Gentoo dummy from Adelie: the second sum changes to 151 and the sum test fails"
    discriminates: "A wrong dummy changes the sums"
    if_fails: "The coefficients would be read against the wrong baseline"
