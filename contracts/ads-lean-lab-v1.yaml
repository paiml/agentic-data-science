# ads-lean-lab-v1: Course E (Lean 4), end-of-course lab (starter fails, solution passes)

metadata:
  version: "1.0.0"
  created: "2026-11-01"
  kind: pattern
  author: "PAIML Engineering"
  description: "Three proof tasks (exact mean of [1,2,3,4] = 5/2, variance non-negative, variance shift-invariant). The starter closes each with sorry and must fail with every task named; the solution must pass with only propext, Classical.choice, Quot.sound."
  references:
    - "labs/c05-final/starter/Lab.lean"
    - "labs/c05-final/solution/Lab.lean"
    - "labs/c05-final/tests/lab-run.sh"
    - "labs/c05-final/tests/lab-verify.sh"
    - "CLASSIFICATION (kind: pattern): grader exit codes over kernel-checked theorems"

equations:
  lab_grader:
    formula: |
      exit(lab-run starter)  = 1 with each sorry task named
      exit(lab-run solution) = 0
      exit(lab-run D) = 2 when D has no lab_ theorem
    domain: "a directory holding Lab.lean"
    codomain: "0 all tasks proved, 1 named failures, 2 not measured"
    postconditions:
      - "SORRY_FAILS: a task whose axioms include sorryAx is FAIL"
      - "AXIOMS: a task using any axiom outside propext, Classical.choice, Quot.sound is FAIL"
      - "ZERO_TASKS: a Lab.lean with no lab_ theorem exits 2, never 0"

proof_obligations:
  - type: invariant
    property: "The grader passes a task iff it elaborates and its axioms are within the allowed set"
    formal: "pass(t) iff #print axioms t has no sorryAx and subset of {propext, Classical.choice, Quot.sound}"
    applies_to: lab_grader

falsification_tests:
  - id: FALSIFY-ADS-LEAN-LAB-001
    rule: "Starter fails with named tasks and the solution passes"
    prediction: "labs/c05-final/tests/lab-verify.sh prints lab-verify: GREEN"
    test: "labs/c05-final/tests/lab-verify.sh"
    mutation: "Replace norm_num [mean] by native_decide in the solution: lab_exact_mean FAILs on the axiom set"
    discriminates: "A solution that trusts the compiler instead of the kernel cannot pass"
    if_fails: "Learners receive a lab whose grader accepts unproved or axiom-leaking answers"
