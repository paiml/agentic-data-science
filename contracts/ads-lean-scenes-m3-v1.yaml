# ads-lean-scenes-m3-v1: Course E (Lean 4), Module 3 scenes (k-means, confusion matrix, CART tree)

metadata:
  version: "1.0.0"
  created: "2026-10-26"
  kind: pattern
  author: "PAIML Engineering"
  description: "Ten on-camera scenes for module 3: the k-means objective with ties to the lowest index, the assignment-step theorem assign_step_optimal, the Species type with confusion_total, the decide ban, the CART impurity dev with strict-gain bestSplit, prune with cp and fitTree, and the P3 golden values (confusion 37,0,0 / 0,16,1 / 0,1,30 = 85 rows, accuracy 83/85, cluster sizes 133, 123, 86)."
  references:
    - "lean/AgenticDS/AgenticDS/Kmeans.lean"
    - "lean/AgenticDS/AgenticDS/Confusion.lean"
    - "lean/AgenticDS/AgenticDS/Tree.lean"
    - "lean/AgenticDS/AgenticDS/Scenes/M3.lean"
    - "lean/AgenticDS/AgenticDSTest/ScenesM3.lean"
    - "demos/e-m3/scenes.spec"
    - "lean/AgenticDS/scripts/AxiomsM3.lean"
    - "datasets/golden/p3.json"
    - "CLASSIFICATION (kind: pattern): theorem statements checked by the Lean kernel, exact numeric postconditions"

equations:
  m3_lean_scenes:
    formula: |
      objective(ps) <= sum_p d(p, f p)           for every assignment f into the centroids
      nearestIdx keeps the lowest index on ties  (strict <)
      sum_a sum_p confusion(ps, a, p) = length ps
      dev(rows) = n - (sum_c count_c^2) / n      dev(pure node) = 0
      golden confusion = [[37,0,0],[0,16,1],[0,1,30]], sum 85, accuracy 83/85
    domain: "ten scene files M3V01..M3V10, each at most 25 lines of 59 columns, registered as v01..v10"
    codomain: "terminal output and kernel-checked theorems"
    postconditions:
      - "SHAPE: every scene file is within 25 lines and 59 columns"
      - "REGISTRY: scenesM3 lists exactly the scene files, and each scene runs"
      - "TOOLS: a tool scene runs the native tool from demos/e-m3, each followed by its own echo exit=$? (no Lean wrapper)"
      - "AXIOMS: every module 3 theorem depends only on propext, Classical.choice, Quot.sound"
      - "CAN_FAIL: changing one golden row changes the matrix the test compares"

proof_obligations:
  - type: invariant
    property: "Theorems minCost_le, assign_step_optimal, confusion_total, dev_nil and dev_pure are kernel-checked and axiom-clean"
    formal: "#print axioms T subset {propext, Classical.choice, Quot.sound}"
    applies_to: m3_lean_scenes

falsification_tests:
  - id: FALSIFY-ADS-LEAN-SCENES-M3-001
    rule: "Ties go to the lowest centroid index and the objective values match the narration"
    prediction: "nearestIdx [9, 9, 9409] = 0, nearestIdx [9, 4, 4] = 1, objective 2, minCost 4"
    test: "lean/AgenticDS/AgenticDSTest/ScenesM3.lean"
    mutation: "Change the strict < in nearestIdx to <=: the tie case returns index 1 and the #guard fails"
    discriminates: "A nearest-centroid search that lets an equal cost replace the earlier centroid"
    if_fails: "Cluster labels would differ from R on equidistant points"
  - id: FALSIFY-ADS-LEAN-SCENES-M3-002
    rule: "dev and bestSplit reproduce the narrated impurity and strict-gain split"
    prediction: "dev is 3 for a 3 and 3 node, 0 for a pure or empty node, bestSplit 1 gives (0, 40), bestSplit 4 gives none"
    test: "lean/AgenticDS/AgenticDSTest/ScenesM3.lean"
    mutation: "Drop the minbucket test from bestSplit: bestSplit 4 returns a split instead of none"
    discriminates: "A split search that ignores the minimum bucket"
    if_fails: "Trees would grow splits that rpart refuses"
  - id: FALSIFY-ADS-LEAN-SCENES-M3-003
    rule: "prune collapses the outlier subtree at cp 2 and fitTree keeps the tree at the root risk over 100"
    prediction: "grown 4 leaves 0 errors, prune cp 2 gives 2 leaves 1 error, fitTree 4 leaves"
    test: "lean/AgenticDS/AgenticDSTest/ScenesM3.lean"
    mutation: "Change the collapse test saving < cp * (leaves - 1) to saving > cp * (leaves - 1): the leaf counts flip"
    discriminates: "A pruning rule that keeps the wrong subtrees"
    if_fails: "The pruned tree would not match R's cost-complexity result"
  - id: FALSIFY-ADS-LEAN-SCENES-M3-004
    rule: "The golden file holds the narrated matrix, cluster sizes and accuracy, and a mutated copy is caught"
    prediction: "confusion 37,0,0 / 0,16,1 / 0,1,30 sums to 85, sizes 133, 123, 86, accuracy 83/85, mutated first row 36,1,0 differs"
    test: "lean/AgenticDS/AgenticDSTest/ScenesM3.lean"
    mutation: "Edit datasets/golden/p3.json first row to 36, 1, 0: the v08 confusion check prints FAIL and the run exits nonzero"
    discriminates: "A parity check that cannot fail on a changed expected value"
    if_fails: "The golden parity story would prove nothing"
  - id: FALSIFY-ADS-LEAN-SCENES-M3-005
    rule: "No scene or library source contains a refused word; the scene shows the gate scan itself"
    prediction: "make lean-scan prints its scan line and exits 0"
    test: "make lean-scan, typed in demos/e-m3/scenes.spec v05 and run by make gate-lean"
    mutation: "Plant one refused word in a scene file: the scan prints the hit, FAIL, and exits 1"
    discriminates: "A scan that reports a pass because it reads nothing"
    if_fails: "The gate's ban would be unenforced"
  - id: FALSIFY-ADS-LEAN-SCENES-M3-006
    rule: "Every scene stays within 25 lines and 59 columns and the registry matches the files"
    prediction: "moduleShape 3 reports 10 files, no faults, and scenesM3 has 10 entries"
    test: "lean/AgenticDS/AgenticDSTest/ScenesM3.lean"
    mutation: "Add a 26th line or a 60-column line to any M3V file: the shape check prints FAIL"
    discriminates: "Scenes that overflow the recorded frame"
    if_fails: "Recorded code would be clipped or wrapped"
  - id: FALSIFY-ADS-LEAN-SCENES-M3-007
    rule: "The camera types only native commands, each with its own exit echo"
    prediction: "scripts/scene-spec.sh replay demos/e-m3/scenes.spec exits 0 and its selftest refuses broken specs"
    test: "scripts/scene-spec.sh (run by scripts/gate-lean.sh stage 4)"
    mutation: "Type bash demos/e-m3/x.sh, a pipe or > /dev/null in a spec line: check refuses it; change an expected output line: replay fails"
    discriminates: "A hidden or wrapped tool, or output the tool no longer prints, cannot merge"
    if_fails: "A video shows a command the viewer cannot run or output the tool did not print"
