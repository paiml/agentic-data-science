# ads-kotlin-lab-v1: Course D (Kotlin), end-of-course lab (starter fails with named tasks, solution passes)

metadata:
  version: "1.0.0"
  created: "2026-11-01"
  kind: pattern
  author: "PAIML Engineering"
  description: "Three tasks (rows after the NA policy = 342, Adelie mean body mass = 3700.66225165563 g, body mass regressed on flipper length) graded by gradle test. The starter has TODO() bodies and must fail with every task named; the solution must pass."
  references:
    - "labs/d-final/starter/src/lab/Lab.kt"
    - "labs/d-final/solution/src/lab/Lab.kt"
    - "labs/d-final/tests/lab/LabTest.kt"
    - "labs/d-final/tests/lab-run.sh"
    - "datasets/golden/p1.json"
    - "CLASSIFICATION (kind: pattern): grader exit codes over an autograder test suite, numeric parity against the committed golden"

equations:
  lab_grader:
    formula: |
      exit(lab-run starter)  = 1 with each failing task named
      exit(lab-run solution) = 0
      exit(lab-run D) = 2 when fewer than 3 tests ran or SHA256SUMS of the dataset mismatch
    domain: "a crate directory with src/lab/Lab.kt and Cargo.toml"
    codomain: "0 all tasks pass, 1 named failures, 2 not measured"
    postconditions:
      - "STUB_FAILS: a src/lab/Lab.kt that still holds TODO() or unimplemented!() is a FAIL even if its tests pass"
      - "ZERO_TESTS: a suite that ran 0 tests exits 2, never 0"
      - "WRONG_ANSWER: a wrong slope or row count fails its named task"

proof_obligations:
  - type: invariant
    property: "The grader passes iff every named task passes and no stub remains"
    formal: "exit = 0 iff forall t in tasks. result(t) = ok and not stub(src)"
    applies_to: lab_grader

falsification_tests:
  - id: FALSIFY-ADS-KOTLIN-LAB-001
    rule: "Starter fails with named tasks and the solution passes"
    prediction: "labs/d-final/tests/lab-verify.sh prints lab-verify: GREEN"
    test: "labs/d-final/tests/lab-verify.sh"
    mutation: "Perturb the solution answer for one task: its named lab_ task FAILs (labs/d-final/tests/lab-falsify.sh)"
    discriminates: "A wrong answer, a left-in stub, a compile error and an empty suite are each refused"
    if_fails: "Learners receive a lab whose grader accepts wrong or unfinished work"
