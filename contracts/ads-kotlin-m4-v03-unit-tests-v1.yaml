# ads-kotlin-m4-v03-unit-tests-v1: Course D (Kotlin), Module 4, scene m4-03 (unit tests)

metadata:
  version: "1.0.0"
  created: "2026-10-26"
  kind: pattern
  author: "PAIML Engineering"
  description: "Scene m4v03 runs the tool's own command (./gradlew --console=plain test) and shows its native output, then exit=0."
  references:
    - "kotlin/ads-kotlin/src/test/kotlin/com/paiml/ads/M4ScenesTest.kt"
    - "kotlin/ads-kotlin/src/test/kotlin/com/paiml/ads/SceneLayoutTest.kt"
    - "kotlin/ads-kotlin/src/test/kotlin/com/paiml/ads/BuildWiringTest.kt"
    - "kotlin/ads-kotlin/scenes/m4v03.scene"
    - "CLASSIFICATION (kind: pattern, not kernel): scene or tool check, no kani harness"

equations:
  m4-v03-unit-tests-v1:
    formula: |
      run: ./gradlew --console=plain test
      native pass line: BUILD SUCCESSFUL
      echo "exit=$?" prints exit=0
    domain: "the merged course tree at the scene commit"
    codomain: "the tool's own output and exit code 0"
    postconditions:
      - "NATIVE_OUTPUT: the pass line is the tool's own; nothing in the build prints a fixed verdict (BuildWiringTest.noFixedPassLineIsPrintedByTheBuild)"
      - "FAILS_ON_FINDINGS: the test task fails on a failing assertion (ToolsFailOnFindingsTest.testTaskFailsOnAFailingAssertion runs test live on a failing @Test; BuildWiringTest rejects ignoreFailures)"
      - "LAYOUT: the shown region is at most 25 lines of at most 59 columns (SceneLayoutTest)"

proof_obligations:
  - type: invariant
    property: "The tool exits 0 on the committed tree"
    formal: "exit(run) = 0 and output contains the native pass line"
    applies_to: m4-v03-unit-tests-v1

falsification_tests:
  - id: FALSIFY-ADS-KOTLIN-M4-V03-001
    rule: "The tool exits 0 on the committed tree"
    prediction: "./gradlew --console=plain test exits 0 on the scene commit"
    test: "./gradlew --console=plain test"
    mutation: "ToolsFailOnFindingsTest.testTaskFailsOnAFailingAssertion: a copy with one failing @Test fails the test task; BuildWiringTest.noToolIsAllowedToIgnoreFailures guards the wiring"
    discriminates: "A tool that cannot fail certifies nothing"
    if_fails: "A gate that cannot fail certifies nothing"
