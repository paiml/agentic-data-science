[[step]]
wait_for = "exit=0 #02"
timeout_ms = 120000

[render]
fps = 60
cell_width = 20
cell_height = 40
font_family = "JetBrains Mono"
theme = "rmedia-dark"

[scan]
extra_deny = []


[source]
repo = "paiml/agentic-data-science"
