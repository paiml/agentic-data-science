schema_version = 1

[contract]
name = "ads-lean-e-m1-v07"
description = "Course E (Lean 4) M1 v07: the pinned scene file scenes/S130.lean prints six axiom lists and its contract line, each followed by its exit echo."

[session]
command = ["bash", "--norc", "--noprofile"]
cwd = "src"
cols = 93
rows = 25
host = "none"
term = "xterm-256color"

[session.env]
BAT_STYLE = "plain"
BAT_THEME = "Monokai Extended"
LAKE_CACHE_DIR = "/mnt/nvme-raid0/tmp/c05d/lakecache"
LAKE_ARTIFACT_CACHE = "true"
LAKE_RESTORE_ARTIFACTS = "true"
PS1 = "$ "
TZ = "UTC"
PATH = "/home/noah/.elan/bin:/mnt/nvme-raid0/w-ads-rust/tools/bin:/usr/bin:/bin"
HOME = "/tmp/rts-home-lean"
INPUTRC = "/dev/null"
HISTFILE = "/dev/null"
LC_ALL = "C.UTF-8"
ELAN_HOME = "/home/noah/.elan"

# rmedia-srt-marks v1 srt-sha256=e1c2cb552acfb79c78c495720edd9aec19d4ed07b2c0269d6ea5113a17060ba2 cues=27
[[step]]
wait_for = "$"
timeout_ms = 10000

[[step]]
send = ["text:cd lean/AgenticDS && clear", "enter"]

[[step]]
wait_for = "$"
timeout_ms = 10000

[[step]]
mark = "c01"

[[step]]
mark = "c02"

[[step]]
mark = "c03"

[[step]]
mark = "c04"

[[step]]
mark = "c05"

[[step]]
mark = "c06"

[[step]]
mark = "c07"

[[step]]
mark = "c08"

[[step]]
mark = "c09"

[[step]]
mark = "c10"

[[step]]
send = ["text:bat -pp scenes/S130.lean", "enter"]

[[step]]
wait_for = "#eval axiomsCheck"
timeout_ms = 300000

[[step]]
mark = "c11"

[[step]]
mark = "c12"

[[step]]
mark = "c13"

[[step]]
mark = "c14"

[[step]]
mark = "c15"

[[step]]
mark = "c16"

[[step]]
mark = "c17"

[[step]]
mark = "c18"

[[step]]
send = ["text:echo \"exit=$? #01\"", "enter"]

[[step]]
wait_for = "exit=0 #01"
timeout_ms = 10000

[[step]]
mark = "c19"

[[step]]
send = ["text:lake env lean scenes/S130.lean", "enter"]

[[step]]
