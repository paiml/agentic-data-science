name = "AgenticDS"
version = "0.1.0"
defaultTargets = ["AgenticDS", "ols-demo", "example-m1"]
allowNonModules = true

[leanOptions]
pp.unicode.fun = true
autoImplicit = false
warningAsError = true
weak.linter.mathlibStandardSet = true
weak.linter.style.longLine.maxLineLength = 68
weak.linter.style.header.license = "Released under MIT license as described in the file LICENSE."

[[require]]
name = "mathlib"
scope = "leanprover-community"

[[lean_lib]]
name = "AgenticDS"


[[lean_exe]]
name = "ols-demo"
root = "AgenticDS.OlsMain"

[[lean_exe]]
name = "example-m1"
root = "AgenticDS.ExampleM1Main"
