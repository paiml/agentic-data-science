name = "AgenticDS"
version = "0.1.0"
defaultTargets = ["AgenticDS", "ols-demo", "ols-test", "planted-slope", "m2v09-slope", "examples-m2-test", "example-m1", "example-m2", "example-m3", "example-m4"]
allowNonModules = true

[leanOptions]
pp.unicode.fun = true
autoImplicit = false
warningAsError = true
weak.linter.mathlibStandardSet = true
weak.linter.style.longLine.maxLineLength = 68
weak.linter.style.header.license = "Released under MIT license as described in the file LICENSE."

[[require]]
name = "mathlib"
scope = "leanprover-community"

[[lean_lib]]
name = "AgenticDS"


[[lean_exe]]
name = "ols-demo"
root = "AgenticDS.OlsMain"

[[lean_exe]]
name = "ols-test"
root = "AgenticDSTest.OlsTest"

[[lean_exe]]
name = "planted-slope"
root = "AgenticDSTest.PlantedSlope"

[[lean_exe]]
name = "m2v09-slope"
root = "AgenticDS.M2V09Slope"

[[lean_exe]]
name = "examples-m2-test"
root = "AgenticDSTest.ExamplesM2"

[[lean_exe]]
name = "example-m1"
root = "AgenticDS.ExampleM1Main"

[[lean_exe]]
name = "example-m2"
root = "AgenticDS.ExampleM2Main"

[[lean_exe]]
name = "example-m3"
root = "AgenticDS.ExampleM3Main"

[[lean_exe]]
name = "example-m4"
root = "AgenticDS.ExampleM4Main"
